[package]
name = "vb-thread"
version = "0.1.0"
edition = "2024"
publish = false
description = "Replays a voice-notes session's thread.jsonl into its takes and placement"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "=12.0.1", features = ["serde-json-impl"] }

[lints]
workspace = true
