[package]
name = "voice-brief-desktop"
version = "0.1.0"
edition = "2024"
publish = false
description = "A desktop window over voice-brief's notes, for Omarchy"

[[bin]]
name = "voice-brief"
path = "src/main.rs"

[dependencies]
vb-thread = { path = "thread" }
gpui-kit = { version = "=0.6.6", default-features = false, features = ["assets"] }
gpui-omarchy = "0.1.3"

[lints]
workspace = true

[workspace]
members = ["thread"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
wildcard_enum_match_arm = "deny"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release.package.gpui-pre-macros]
debug-assertions = true
